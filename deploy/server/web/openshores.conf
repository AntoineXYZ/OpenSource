ServerName localhost
ServerTokens Prod
ServerSignature Off
ErrorLog /proc/self/fd/2

<VirtualHost *:80>
    DocumentRoot /opt/openshores/www
    DirectoryIndex index.php
    RedirectMatch 302 ^/index\.html$ /
    RedirectMatch 302 ^/playerson\.html$ /playerson.php
    Action application/x-httpd-php /cgi-bin/php
    AliasMatch ^/reset$ /opt/openshores/www/reset.html
    AliasMatch ^/register$ /opt/openshores/www/register.html
    AliasMatch ^/emailchange$ /opt/openshores/www/emailchange.html
    AliasMatch ^/passchange$ /opt/openshores/www/passchange.html

    CustomLog /proc/self/fd/1 combined

    <Directory /opt/openshores/www>
        Options None
        AllowOverride None
        Require all granted
        <FilesMatch "^(index|playerson)\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    ScriptAlias /cgi-bin/ /opt/openshores/cgi-bin/
    <LocationMatch "^/cgi-bin/AuAcct(Email|Password)$">
        PassEnv AU_LOGIN_SERVER
        LimitRequestBody 16384
    </LocationMatch>
    <LocationMatch "^/cgi-bin/AuAcctNew$">
        PassEnv AU_LOGIN_SERVER AU_ACCOUNT_REGISTRATION AU_WEBMASTER_PASSWORD
        LimitRequestBody 16384
    </LocationMatch>
    <Directory /opt/openshores/cgi-bin>
        Options +ExecCGI -Indexes -MultiViews
        AllowOverride None
        Require all granted
        CGIDScriptTimeout 15
    </Directory>

    # Exercise CGI execution without exposing the health check outside the container.
    <Location /cgi-bin/health.cgi>
        Require local
    </Location>

    # The PHP page runs three bounded status queries before returning its HTML.
    <Location /cgi-bin/php>
        CGIDScriptTimeout 45
    </Location>

    Alias /reports/ /var/lib/openshores/reports/
    <Directory /var/lib/openshores/reports>
        Options None
        AllowOverride None
        Require all granted
        # Generated content is served as static files, never executable code.
        <FilesMatch "(?i)\.(cgi|php[0-9]*|phtml|phar|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
